<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MacroPulse">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>MacroPulse</title>
<style>
:root{--bg:#0a0e13;--card:#111821;--card2:#17212d;--line:#202c3b;--tx:#e8eef5;--mut:#7f8da0;--teal:#2ee6b6;--blue:#38bdf8;--org:#fbae3c;--red:#ff6b6b;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--tx);font-size:16px}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;background:rgba(10,14,19,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;border-radius:10px;background:#0f2a2c;display:grid;place-items:center}
.brand b{font-size:17px;letter-spacing:.2px;display:block;line-height:1.1}
.brand small{color:var(--teal);font-size:11px;letter-spacing:.3px}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
main{padding:14px 14px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.mut{color:var(--mut)}.sm{font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.8px;color:var(--teal);font-weight:600}
h2{font-size:20px;margin:2px 0 4px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px}
.sec-head h2{margin:0}
.datenav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.datenav .iconbtn{width:36px;height:36px}
.datenav .dl{font-weight:600}
.sumrow{display:flex;gap:14px;align-items:center}
.ringwrap{position:relative;width:132px;height:132px;flex:none}
.ring{width:100%;height:100%;display:block}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-c b{font-size:28px;line-height:1}
.ring-c span{font-size:10px;color:var(--mut);letter-spacing:.8px;margin-top:3px}
.ring-c small{font-size:11px;color:var(--mut);margin-top:3px}
.bars{flex:1;min-width:0}
.bar{margin-bottom:11px}
.bar .bt{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-bottom:5px;gap:6px}
.bar .bt .l{display:flex;align-items:center;gap:6px;font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.track{height:6px;border-radius:4px;background:#1b2634;overflow:hidden}
.fill{height:100%;border-radius:4px}
.left{font-size:10.5px;padding:2px 6px;border-radius:6px;background:#12312e;color:var(--teal);font-weight:600;white-space:nowrap}
.left.over{background:#3a1d22;color:var(--red)}
.fiber{display:flex;justify-content:space-between;font-size:12px;margin-top:2px}
.water .wt{display:flex;justify-content:space-between;align-items:center}
.water b.big{font-size:22px}
.water .wt small{color:var(--blue);font-size:11px;letter-spacing:.5px;font-weight:600}
.btn{white-space:nowrap;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--card2);border:1px solid var(--line);text-align:center}
.btn.primary{background:var(--teal);color:#042019;border-color:var(--teal)}
.btn.blue{background:var(--blue);color:#04202c;border-color:var(--blue)}
.btn.danger{background:#2a1519;color:var(--red);border-color:#47232a}
.btn.sm{padding:7px 12px;font-size:13px}
.btn[disabled]{opacity:.45}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;background:var(--card2);border:1px solid var(--line);color:var(--tx)}
.pill.on{background:var(--teal);color:#042019;border-color:var(--teal)}
.pill.w{border-color:#1d4a63;color:var(--blue)}
.meal .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.meal .mh .mn{display:flex;align-items:center;gap:10px}
.mico{width:30px;height:30px;border-radius:9px;background:#0f2a2c;display:grid;place-items:center;font-size:15px}
.meal .mh b{font-size:16px;display:block}
.meal .mh small{color:var(--mut);font-size:11px}
.meal .mk{font-size:20px;font-weight:700;text-align:right}
.meal .mk small{display:block;font-size:10px;color:var(--mut);font-weight:600;letter-spacing:.6px}
.entry{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.entry .en{font-weight:600;font-size:14px}
.entry .er{text-align:right;white-space:nowrap}
.entry .er b{font-size:14px}
.addfood{display:block;width:100%;margin-top:6px;padding:10px;border:1px dashed #2a4a52;border-radius:10px;color:var(--teal);font-weight:600;font-size:13px}
.empty{color:var(--mut);font-size:13px;padding:6px 0 2px}
.fab{position:fixed;right:max(18px,calc(50% - 260px + 18px));bottom:calc(86px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;background:var(--teal);color:#042019;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.45);z-index:15;display:grid;place-items:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(14,19,26,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:9.5px;letter-spacing:.4px;color:var(--mut);font-weight:600}
nav.tabs button.on{color:var(--teal)}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.search{display:flex;gap:8px;margin-bottom:10px}
.inp{width:100%;background:#0d141c;border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.inp:focus{outline:none;border-color:var(--teal)}
.sbox{position:relative;flex:1}
.sbox .inp{padding-right:36px}
.sbox .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--mut);padding:6px}
.filters{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .pill{flex:none}
.cnt{font-size:11px;letter-spacing:.6px;color:var(--teal);margin:2px 2px 8px;font-weight:600}
.frow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:9px;cursor:pointer}
.frow:active{border-color:var(--teal)}
.fh{display:flex;align-items:center;gap:11px}
.fico{width:42px;height:42px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:22px;flex:none}
.fmid{flex:1;min-width:0}
.fname{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fk{text-align:right}
.fk b{font-size:18px;display:block;line-height:1.1}
.fk span{font-size:9.5px;color:var(--mut);letter-spacing:.6px}
.star{font-size:20px;color:#3a4757;padding:4px 2px 4px 6px}
.star.on{color:var(--org)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{font-size:11px;padding:3px 8px;border-radius:7px;font-weight:600;background:#1a2430;color:#b9c5d3}
.chip.nc{background:#10302c;color:var(--teal)}
.chip.p{background:#0f2a3a;color:var(--blue)}
.chip.f{background:#3a2a10;color:var(--org)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}
.sh{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#0f161e;border-top:1px solid var(--line);border-radius:22px 22px 0 0;max-width:520px;margin:0 auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;max-height:92dvh;overflow-y:auto}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.x{width:32px;height:32px;border-radius:50%;background:var(--card2);color:var(--mut)}
.meal-pills{display:flex;gap:7px;overflow-x:auto;margin-bottom:12px}
.meal-pills .pill{flex:none}
.ls-name{font-size:22px;font-weight:700}
.ls-kcal{margin:10px 0;display:flex;align-items:baseline;gap:8px}
.ls-kcal b{font-size:40px;color:var(--teal);line-height:1}
.ls-kcal span{font-size:11px;color:var(--mut);letter-spacing:.7px}
.stepper{display:flex;align-items:center;gap:10px;margin:10px 0}
.stepper button{width:48px;height:48px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:24px}
.stepper input{flex:1;text-align:center;font-size:24px;font-weight:700;background:#0d141c;border:1px solid var(--line);border-radius:12px;padding:8px;min-width:0}
.stepper span{color:var(--mut);font-weight:600}
.qq{display:flex;gap:7px;margin-bottom:6px}
.btnrow{display:flex;gap:10px;margin-top:16px}
.btnrow .btn{flex:1}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.nutbox{background:#0d141c;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.netres{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:10px 12px;border-radius:12px;background:#10302c}
.netres b{color:var(--teal);font-size:20px}
.ok{color:var(--teal);font-size:11px;font-weight:600}
.warn{color:var(--org);font-size:11px;font-weight:600}
.rowitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rowitem:first-child{border-top:0}
.rowitem .rn{font-weight:600;font-size:14px;min-width:0}
.rowitem .acts{display:flex;gap:6px;flex:none}
.seg{display:inline-flex;background:#0d141c;border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{padding:6px 11px;border-radius:7px;font-size:12px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--teal);color:#042019}
.bigk{font-size:34px;font-weight:700}
.bigk small{font-size:14px;color:var(--teal);margin-left:4px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.tile{background:#0d141c;border:1px solid var(--line);border-radius:12px;padding:10px}
.tile .tl{font-size:10px;letter-spacing:.7px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:5px}
.tile b{font-size:22px}
.tile b small{font-size:12px;color:var(--mut)}
.tile .ts{font-size:10.5px;color:var(--mut)}
.ratio{display:flex;height:8px;border-radius:5px;overflow:hidden;margin:6px 0}
.ing{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.ing:first-of-type{border-top:0}
.ing .in{flex:1;min-width:0}
.ing .in b{font-size:14px;display:block}
.ing .in small{color:var(--mut);font-size:11px}
.ing input{width:72px;text-align:right;background:#0d141c;border:1px solid var(--line);border-radius:9px;padding:7px 8px}
.ing .u{color:var(--mut);font-size:12px}
.crumb{margin-bottom:10px}
.crumb button{color:var(--teal);font-weight:600;padding:4px 2px}
.note{font-size:12px;color:var(--mut);line-height:1.5}
.sep{height:1px;background:var(--line);margin:14px 0}
.streak{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding:9px 12px;border-radius:12px;background:#1d2a1f;border:1px solid #28402f}
.streak b{font-size:15px}.streak .fl{display:flex;align-items:center;gap:8px}
.streak svg{width:20px;height:20px;fill:#fbae3c}
.streak .mut{font-size:11.5px}
.hrow{display:flex;gap:8px;align-items:flex-end}
.hrow .field{flex:1;margin-bottom:0}
.hrow .btn{height:46px;padding:0 16px}
.rchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rchip{display:inline-flex;align-items:center;gap:6px;background:#1a2430;border-radius:8px;padding:4px 4px 4px 9px;font-size:12px;font-weight:600}
.rchip button{width:20px;height:20px;border-radius:50%;background:#26323f;color:var(--mut);font-size:11px;line-height:1}
.hstat{display:flex;gap:10px;margin:8px 0}
.hstat div{flex:1;background:#0d141c;border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.hstat small{display:block;font-size:10px;letter-spacing:.6px;color:var(--mut);font-weight:600}
.hstat b{font-size:19px}
.hstat b u{text-decoration:none;font-size:11px;color:var(--mut);font-weight:600}
.pos{color:var(--org)}.neg{color:var(--teal)}
.spark{width:100%;height:auto;display:block;margin-top:6px}
.fastbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fastbar .ft{flex:1;min-width:0}
.fastbar b{font-size:17px}
.wk table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.wk td{padding:8px 0;border-top:1px solid var(--line)}
.wk td:last-child{text-align:right;font-weight:700}
.wk td small{display:block;color:var(--mut);font-weight:500;font-size:11px}
.hist{display:flex;gap:6px;align-items:flex-end;height:64px;margin-top:10px}
.hist div{flex:1;border-radius:5px 5px 0 0;background:#1d4a63;position:relative;min-height:3px}
.hist div.hit{background:var(--teal)}
.hist span{position:absolute;top:-15px;left:0;right:0;text-align:center;font-size:9.5px;color:var(--mut)}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.legend i.dash{width:16px;height:0;border-top:2px dashed;border-radius:0;background:none}
.goalline{font-size:16px}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 8px}
.tiles2 .tile b{font-size:21px}
.rvphoto{background:#0d141c;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.rvimg{width:84px;height:112px;object-fit:cover;border-radius:10px;background:#000;flex:none}
.rvrow{display:grid;grid-template-columns:24px 1fr 84px auto;gap:8px;align-items:center;margin-top:8px}
.rvrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--teal)}
.rvrow .inp{padding:9px 10px}
.rvrow .rv-u{min-width:36px}
.rvtxt{white-space:pre-wrap;font-size:11px;color:var(--mut);background:#0a0e13;border-radius:8px;padding:8px;max-height:160px;overflow:auto}
.scanbtn{display:flex;align-items:center;gap:6px;flex:none;padding:0 14px;border-radius:12px;background:#0f3b44;color:var(--teal);border:1px solid #1d5b66;font-weight:600;font-size:14px}
.scanbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vidwrap{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3;margin:6px 0 10px}
.vidwrap video{width:100%;height:100%;object-fit:cover;display:block}
.vidwrap .guide{position:absolute;left:12%;right:12%;top:36%;bottom:36%;border:2px solid var(--teal);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.vidwrap .guide:after{content:'';position:absolute;left:6%;right:6%;top:50%;height:2px;background:var(--red);opacity:.8}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#1d2b39;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="#2ee6b6"><path d="M12 2.5c3.6 4.2 6 7.4 6 10.6a6 6 0 0 1-12 0c0-3.2 2.4-6.4 6-10.6z"/></svg></div>
      <div><b>MacroPulse</b><small id="hdate"></small></div>
    </div>
    <button class="iconbtn" data-a="settings" aria-label="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e8eef5" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button>
  </header>
  <main id="view"></main>
  <nav class="tabs"><div class="in" id="tabs">
    <button data-a="tab" data-t="log"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>LOG</button>
    <button data-a="tab" data-t="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>SEARCH</button>
    <button data-a="tab" data-t="custom"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="#0a0e13"/><circle cx="15" cy="12" r="2" fill="#0a0e13"/><circle cx="8" cy="17" r="2" fill="#0a0e13"/></svg>CUSTOM</button>
    <button data-a="tab" data-t="recipes"><svg viewBox="0 0 24 24"><path d="M4 5.5C6.5 4 9.5 4 12 5.5v13c-2.5-1.5-5.5-1.5-8 0zM20 5.5c-2.5-1.5-5.5-1.5-8 0v13c2.5-1.5 5.5-1.5 8 0z"/></svg>RECIPES</button>
    <button data-a="tab" data-t="health"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.4A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>HEALTH</button>
  </div></nav>
</div>
<div id="sheet-root"></div>
<div id="toast"></div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var num=function(v){var n=parseFloat(v);return isFinite(n)?n:0};
var fmt=function(n){n=Math.round(n*10)/10;return n%1===0?String(n):n.toFixed(1)};
var r0=function(n){return Math.round(n)};
var fq=function(n){return String(Math.round(n*100)/100)};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var pad=function(n){return String(n).padStart(2,'0')};
var dstr=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var today=function(){return dstr(new Date())};
var parseD=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var addDays=function(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return dstr(d)};
function dlabel(s){
  var t=today(),d=parseD(s),base=d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  if(s===t)return 'Today, '+base;
  if(s===addDays(t,-1))return 'Yesterday, '+base;
  if(s===addDays(t,1))return 'Tomorrow, '+base;
  return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
}
var ncOf=function(b){return Math.max(0,b.c-b.fi-b.po)};

function recipeNut(r){
  var tot={k:0,c:0,fi:0,po:0,p:0,f:0},g=0;
  (r.ing||[]).forEach(function(i){var b=scale(i.pg,i.g);for(var k in tot)tot[k]+=b[k];g+=i.g});
  var n=Math.max(1,r.servings||1),ser=scale(tot,1/n);
  return {tot:tot,ser:ser,g:g,n:n};
}

}
function bar(label,color,val,goal){

    $('#ls-g',el).textContent=food.g?'≈ '+r0(food.g*q)+' g total':'';

    }
    save();closeSheet();render();
  });
  if(edit)$('#ls-del',el).addEventListener('click',function(){
    S.log[ui.date]=(S.log[ui.date]||[]).filter(function(e){return e.id!==entry.id});
    save();closeSheet();render();toast('Deleted');
  });
  upd();
}

function filtered(){
  var q=ui.q.trim().toLowerCase(),f=ui.filter,list=allFoods();
  if(f==='recent')list=S.recent.map(foodById).filter(Boolean);
  else if(f==='fav')list=S.fav.map(foodById).filter(Boolean);
  else if(f==='custom')list=list.filter(function(x){return x.t==='custom'});
  else if(f==='recipes')list=list.filter(function(x){return x.t==='recipe'});
  if(q){var words=q.split(/\s+/);list=list.filter(function(x){var s=(x.name+' '+x.src).toLowerCase();return words.every(function(w){return s.indexOf(w)>-1})})}
  if(f==='all'||f==='fav'){
    list=list.slice().sort(function(a,b){
      var ra=S.recent.indexOf(a.id),rb=S.recent.indexOf(b.id);
      if(ra>-1&&rb>-1)return ra-rb;if(ra>-1)return -1;if(rb>-1)return 1;
      return a.name.localeCompare(b.name);
    });
  }
  return list;
}

/* ---------- barcode scanner ---------- */
var scanState={stream:null,timer:null,reader:null,running:false};
function stopScan(){
  scanState.running=false;
  if(scanState.timer){clearTimeout(scanState.timer);scanState.timer=null}
  if(scanState.stream){scanState.stream.getTracks().forEach(function(t){t.stop()});scanState.stream=null}
}
function loadZXing(){
  return new Promise(function(res,rej){
    if(window.ZXing)return res();
    var sc=document.createElement('script');sc.src='zxing.min.js';
    sc.onload=function(){res()};sc.onerror=function(){rej(new Error('lib'))};
    document.head.appendChild(sc);
  });
}
function openScanner(mode){
  var el=sheet('<div class="sh-h"><div class="eyebrow">SCAN BARCODE</div><button class="x" data-a="close">✕</button></div>'+
    '<div class="vidwrap" id="sc-wrap"><video id="sc-v" playsinline muted autoplay></video><div class="guide"></div></div>'+
    '<div class="mut sm" id="sc-s">Starting camera...</div>'+
    '<div class="sep"></div><div class="field"><label for="sc-m">Or type the barcode number</label><div style="display:flex;gap:8px"><input class="inp" id="sc-m" inputmode="numeric" placeholder="e.g. 0737628064502"><button class="btn primary" id="sc-go">Look up</button></div></div>');
  var vid=$('#sc-v',el),status=$('#sc-s',el);
  function done(code){stopScan();closeSheet();lookupBarcode(code,mode)}
  $('#sc-go',el).addEventListener('click',function(){
    var c=$('#sc-m',el).value.replace(/\D/g,'');
    if(c.length<6){toast('Enter the full barcode number');return}
    done(c);
  });
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    $('#sc-wrap',el).style.display='none';status.textContent='Camera is not available here. Type the barcode number below.';return;
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false}).then(function(stream){
    if(!$('#sc-v')){stream.getTracks().forEach(function(t){t.stop()});return}
    scanState.stream=stream;scanState.running=true;vid.srcObject=stream;
    var p=vid.play();if(p&&p.catch)p.catch(function(){});
    status.textContent='Point the camera at the barcode. Hold steady and fill the box.';
    var native=null;
    try{if('BarcodeDetector' in window)native=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']})}catch(e){native=null}
    var cv=document.createElement('canvas'),ctx=cv.getContext('2d',{willReadFrequently:true});
    function tick(){
      if(!scanState.running)return;
      if(vid.readyState<2||!vid.videoWidth){scanState.timer=setTimeout(tick,150);return}
      if(native){
        native.detect(vid).then(function(r){if(r&&r.length&&scanState.running)done(r[0].rawValue);else scanState.timer=setTimeout(tick,150)}).catch(function(){scanState.timer=setTimeout(tick,250)});
      }else{
        try{
          var w=vid.videoWidth,h=vid.videoHeight,sc=Math.min(1,960/w);
          cv.width=Math.round(w*sc);cv.height=Math.round(h*sc);ctx.drawImage(vid,0,0,cv.width,cv.height);
          var src=new ZXing.HTMLCanvasElementLuminanceSource(cv),bmp=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src));
          var r=scanState.reader.decodeWithState(bmp);
          if(r&&scanState.running){done(r.getText());return}
        }catch(e){}
        scanState.timer=setTimeout(tick,120);
      }
    }
    if(native){tick()}
    else loadZXing().then(function(){
      var hints=new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E]);
      hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
      scanState.reader=new ZXing.MultiFormatReader();scanState.reader.setHints(hints);
      tick();
    }).catch(function(){status.textContent='Could not load the scanner. Type the barcode number below.'});
  }).catch(function(){
    $('#sc-wrap',el).style.display='none';
    status.textContent='Camera permission was denied or no camera was found. Type the barcode number below, or allow camera access for this site in your phone settings.';
  });
}
function lookupBarcode(code,mode){
  code=String(code).replace(/\D/g,'');
  var cached=S.custom.filter(function(c){return c.bc===code})[0];
  if(cached){
    if(mode==='form'){ui.cfEdit=cached.id;ui.cfBc=cached.bc;ui.cf={name:cached.name,src:cached.src||'',srv:cached.srv,g:String(cached.g),k:String(cached.b.k),c:String(cached.b.c),fi:String(cached.b.fi),po:String(cached.b.po),p:String(cached.b.p),f:String(cached.b.f)};go('custom');toast('Already saved - editing it')}
    else{var f=foodById(cached.id);if(f)openLogSheet(f)}
    return;
  }
  toast('Looking up '+code+'...');
  var url='https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=code,product_name,generic_name,brands,serving_size,serving_quantity,nutriments';
  fetch(url).then(function(r){return r.json()}).then(function(j){
    var p=j&&j.product;
    if(!j||j.status!==1||!p||!(p.product_name||p.generic_name)){
      ui.cf={};ui.cfEdit=null;ui.cfBc=code;go('custom');toast('Not in the database. Enter it from the label.');return;
    }
    var n=p.nutriments||{},hasSrv=n['energy-kcal_serving']!=null||n['carbohydrates_serving']!=null||n['proteins_serving']!=null;
    var sfx=hasSrv?'_serving':'_100g';
    function nv(k){var v=n[k+sfx];return v==null||v===''?0:num(v)}
    var kcal=n['energy-kcal'+sfx]!=null?num(n['energy-kcal'+sfx]):(n['energy'+sfx]!=null?num(n['energy'+sfx])/4.184:0);
    var c=nv('carbohydrates'),fi=nv('fiber'),po=nv('polyols'),pr=nv('proteins'),fa=nv('fat');
    var noFiber=n['fiber'+sfx]==null;
    if(!(kcal>0))kcal=4*pr+9*fa+4*Math.max(0,c-fi-po);
    var g=hasSrv?(num(p.serving_quantity)>0?num(p.serving_quantity):100):100;
    var food={id:uid(),bc:code,name:String(p.product_name||p.generic_name).trim(),src:String(p.brands||'').split(',')[0].trim(),
      srv:hasSrv?(String(p.serving_size||'1 serving').trim()):'100 g',g:g,b:{k:Math.round(kcal),c:Math.round(c*10)/10,fi:Math.round(fi*10)/10,po:Math.round(po*10)/10,p:Math.round(pr*10)/10,f:Math.round(fa*10)/10}};
    if(mode==='form'){
      ui.cfEdit=null;ui.cfBc=code;
      ui.cf={name:food.name,src:food.src,srv:food.srv,g:String(food.g),k:String(food.b.k),c:String(food.b.c),fi:String(food.b.fi),po:String(food.b.po),p:String(food.b.p),f:String(food.b.f)};
      go('custom');toast(noFiber?'Filled in. Fiber not listed, so check net carbs.':'Filled in. Check it against the label, then save.');
    }else{
      S.custom.push(food);save();
      var cf=foodById(food.id);if(cf)openLogSheet(cf);
      toast(noFiber?'Saved. Fiber not listed, so net carbs may read high.':'Saved to My Foods. Verify against the label.');
    }
  }).catch(function(){toast('Lookup failed. Check your connection.')});
}


/* ---------- health: streak, fasting, weight, ketones, glucose, weekly ---------- */
var MIN_KCAL=500;
function monday(d){var x=parseD(d),dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);return dstr(x)}
function dayStatus(d){
  var es=dayEntries(d);if(!es.length)return 'none';
  var t=dayTotals(d);
  if(t.nc>S.goals.nc+1e-9)return 'fail';
  if(t.k<MIN_KCAL)return 'low';
  return 'ok';
}
function streakInfo(){
  var t=today(),st=dayStatus(t),cur=0,d=t,pending=false;
  if(st==='ok'){cur=1;d=addDays(t,-1)}
  else if(st==='fail'){d=null}
  else{pending=true;d=addDays(t,-1)}
  while(d){if(dayStatus(d)==='ok'){cur++;d=addDays(d,-1)}else break}
  var keys=Object.keys(S.log).filter(function(k){return S.log[k]&&S.log[k].length}).sort(),best=0,run=0;
  if(keys.length){
    var x=keys[0];
    while(x<=t){if(dayStatus(x)==='ok'){run++;if(run>best)best=run}else if(!(x===t&&dayStatus(x)==='low'))run=0;x=addDays(x,1)}
  }
  return {cur:cur,best:Math.max(best,cur),pending:pending&&st!=='fail'};
}
function streakHtml(){
  var s=streakInfo();
  return '<div class="streak"><div class="fl"><svg viewBox="0 0 24 24"><path d="M12 2c1 3.5 5 5.5 5 10.5A5 5 0 0 1 7 13c0-1.6.7-2.8 1.6-3.8C9 11 10 11.5 10.8 11 10 8 10.5 4.5 12 2z"/></svg><div><b>'+s.cur+'-day</b> net-carb streak</div></div><div class="mut">'+(s.pending&&s.cur>0?'today pending · ':'')+'Best '+s.best+'</div></div>';
}

/* fasting */
function fmtDur(ms){var m=Math.max(0,Math.floor(ms/60000));return Math.floor(m/60)+'h '+pad(m%60)+'m'}
function fmtTime(ts){return new Date(ts).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}
function fmtDT(ts){var d=new Date(ts),t=dstr(d),lab=t===today()?'Today':t===addDays(today(),-1)?'Yesterday':d.toLocaleDateString(undefined,{weekday:'short'});return lab+' '+fmtTime(ts)}
function fastCompactHtml(){
  var goal=S.fastGoal*3600000;
  if(S.fast){
    var el=Date.now()-S.fast.start,pct=Math.min(100,el/goal*100),hit=el>=goal;
    return '<div class="fastbar"><div class="ft"><div class="eyebrow">FASTING'+(hit?' · GOAL REACHED':'')+'</div><b>'+fmtDur(el)+'</b> <span class="mut sm">of '+fmt(S.fastGoal)+'h · since '+esc(fmtDT(S.fast.start))+'</span></div><button class="btn sm" data-a="fastend">End fast</button></div><div class="track" style="margin-top:10px"><div class="fill" style="width:'+pct+'%;background:'+(hit?'var(--teal)':'var(--blue)')+'"></div></div>';
  }
  var last=S.fasts.length?S.fasts[S.fasts.length-1]:null;
  return '<div class="fastbar"><div class="ft"><div class="eyebrow">FASTING</div><span class="mut sm">'+(last?'Last fast: '+fmtDur(last.end-last.start):'Not fasting')+'</span></div><button class="btn primary sm" data-a="faststart">Start fast</button></div>';
}
function fastFullHtml(){
  var goalMs=S.fastGoal*3600000,h='';
  if(S.fast){
    var el=Date.now()-S.fast.start,R=54,C=2*Math.PI*R,pct=Math.min(1,el/goalMs),hit=el>=goalMs,left=goalMs-el;
    h+='<div class="sumrow"><div class="ringwrap"><svg viewBox="0 0 130 130" class="ring"><circle cx="65" cy="65" r="'+R+'" fill="none" stroke="#1b2634" stroke-width="11"/><circle cx="65" cy="65" r="'+R+'" fill="none" stroke="'+(hit?'#2ee6b6':'#38bdf8')+'" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+(C*pct)+' '+C+'" transform="rotate(-90 65 65)"/></svg><div class="ring-c"><b style="font-size:19px">'+fmtDur(el)+'</b><span>ELAPSED</span><small>goal '+fmt(S.fastGoal)+'h</small></div></div><div style="flex:1"><div class="mut sm">STARTED</div><b>'+esc(fmtDT(S.fast.start))+'</b><div class="mut sm" style="margin-top:8px">'+(hit?'GOAL REACHED':'GOAL IN')+'</div><b style="color:'+(hit?'var(--teal)':'var(--tx)')+'">'+(hit?'+'+fmtDur(-left):fmtDur(left))+'</b><div class="mut sm" style="margin-top:8px">GOAL ENDS</div><b>'+esc(fmtDT(S.fast.start+goalMs))+'</b></div></div>'+
      '<div class="btnrow"><button class="btn" data-a="fastedit">Change start</button><button class="btn primary" data-a="fastend">End fast</button></div><button class="btn danger sm" style="width:100%;margin-top:10px" data-a="fastcancel">Discard this fast</button>';
  }else{
    h+='<div class="mut sm" style="margin-bottom:10px">Start the timer when you stop eating. If you forgot, set the actual start time.</div><div class="btnrow" style="margin-top:0"><button class="btn primary" data-a="fastnow">Start now</button><button class="btn" data-a="faststart">Set start time</button></div>';
  }
  var hist=S.fasts.slice(-7);
  if(hist.length){
    var mx=Math.max.apply(null,hist.map(function(f){return f.end-f.start}).concat([goalMs])),avg=hist.reduce(function(a,f){return a+f.end-f.start},0)/hist.length,hits=hist.filter(function(f){return f.end-f.start>=goalMs}).length;
    h+='<div class="sep"></div><div class="eyebrow">LAST '+hist.length+' FASTS</div><div class="hist" style="margin-top:20px">'+hist.map(function(f){var d=f.end-f.start;return '<div class="'+(d>=goalMs?'hit':'')+'" style="height:'+Math.max(5,d/mx*100)+'%"><span>'+(d/3600000).toFixed(1)+'</span></div>'}).join('')+'</div><div class="mut sm" style="margin-top:8px">Average '+fmtDur(avg)+' · '+hits+' of '+hist.length+' reached '+fmt(S.fastGoal)+'h</div>';
  }
  return h;
}
function tickFast(){
  var a=$('#fast-compact'),b=$('#fast-full');
  if(a&&!document.hidden)a.innerHTML=fastCompactHtml();
  if(b&&!document.hidden)b.innerHTML=fastFullHtml();
}
function openFastStart(editing){
  var now=Date.now();
  var el=sheet('<div class="sh-h"><div class="eyebrow">'+(editing?'CHANGE START TIME':'WHEN DID YOU START FASTING?')+'</div><button class="x" data-a="close">✕</button></div>'+
    '<div class="chiprow" style="margin:0 0 14px">'+[[0,'Just now'],[15,'15 min ago'],[30,'30 min ago'],[60,'1 hr ago'],[120,'2 hr ago'],[180,'3 hr ago']].map(function(x){return '<button class="pill" data-ago="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>'+
    '<div class="field"><label for="fs-t">Or set a time (today, or yesterday if later than now)</label><input class="inp" id="fs-t" type="time" value="'+(function(){var d=new Date(editing&&S.fast?S.fast.start:now);return pad(d.getHours())+':'+pad(d.getMinutes())})()+'"></div>'+
    '<div class="btnrow"><button class="btn primary" id="fs-ok">'+(editing?'Save':'Start fast')+'</button></div>');
  function commit(ts){
    if(editing&&S.fast)S.fast.start=ts;else S.fast={start:ts};
    save();closeSheet();render();toast(editing?'Start time updated':'Fast started');
  }
  el.addEventListener('click',function(ev){var a=ev.target.dataset.ago;if(a!=null)commit(Date.now()-Number(a)*60000)});
  $('#fs-ok',el).addEventListener('click',function(){
    var v=$('#fs-t',el).value;if(!v){toast('Pick a time');return}
    var p=v.split(':'),d=new Date();d.setHours(Number(p[0]),Number(p[1]),0,0);
    if(d.getTime()>Date.now())d.setDate(d.getDate()-1);
    commit(d.getTime());
  });
}

var LB=2.20462;
var wDisp=function(lb){return S.units==='kg'?lb/LB:lb};
var wFrom=function(v){return S.units==='kg'?v*LB:v};
var wFmt=function(lb){return (Math.round(wDisp(lb)*10)/10).toFixed(1)};
function avgOf(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:null}
function weightsIn(from,to){var out=[],d=from;while(d<=to){var w=vit(d).w;if(w!=null)out.push(w);d=addDays(d,1)}return out}

function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(t)}
  return new Promise(function(res,rej){
    var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();
    try{document.execCommand('copy')?res():rej()}catch(e){rej(e)}a.remove();
  });
}

var fromDn=function(n){var d=new Date(n*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())};
var dnLabel=function(n){return new Date(n*864e5).toLocaleDateString(undefined,{month:'short',day:'numeric',timeZone:'UTC'})};
var dnLabelY=function(n){return new Date(n*864e5).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'})};
function vit(d){var v=S.vit[d]||{};return {k:v.k||[],g:v.g||[],w:v.w==null?null:v.w,m:v.m||{}}}
function rdgs(d,type){var v=vit(d);return type==='k'?v.k:type==='g'?v.g:(v.m[type.slice(2)]||[])}
function dailyAvg(type,d){return avgOf(rdgs(d,type).map(function(x){return x.v}))}

/* ---------- charts ---------- */
function niceTicks(lo,hi,n){
  var span=hi-lo;if(span<=0)span=1;
  var raw=span/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/mag,step=(f<1.5?1:f<3?2:f<7?5:10)*mag;
  var a=Math.floor(lo/step)*step,b=Math.ceil(hi/step)*step,out=[];
  for(var v=a;v<=b+step/2;v+=step)out.push(Math.round(v/step)*step);
  return {ticks:out,lo:a,hi:b,step:step};
}
function chartSvg(o){
  var W=340,H=o.H||214,L=38,R=12,T=12,B=26,i;
  var xs=function(x){return L+(x-o.x0)/((o.x1-o.x0)||1)*(W-L-R)};
  var ys=function(y){return T+(1-(y-o.y0)/((o.y1-o.y0)||1))*(H-T-B)};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'Chart')+'">';
  (o.yTicks||[]).forEach(function(v){var y=ys(v);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="#1f2a38"/><text x="'+(L-5)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" font-size="9.5" fill="#7f8da0">'+o.yFmt(v)+'</text>'});
  var nx=4;
  for(i=0;i<=nx;i++){var xv=Math.round(o.x0+(o.x1-o.x0)*i/nx);s+='<text x="'+xs(xv).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+(i===0?'start':i===nx?'end':'middle')+'" font-size="9.5" fill="#7f8da0">'+dnLabel(xv)+'</text>'}
  (o.vlines||[]).forEach(function(v){if(v.x<o.x0||v.x>o.x1)return;var x=xs(v.x);s+='<line x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="'+v.color+'" stroke-dasharray="3 3" opacity=".8"/>'});
  (o.hlines||[]).forEach(function(h){var y=ys(h.y);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="'+h.color+'" stroke-dasharray="5 4" stroke-width="1.4"/>'});
  (o.series||[]).forEach(function(se){
    if(se.line&&se.pts.length>1){
      var d='';se.pts.forEach(function(p,j){d+=(j?'L':'M')+xs(p[0]).toFixed(1)+' '+ys(p[1]).toFixed(1)});
      s+='<path d="'+d+'" fill="none" stroke="'+se.color+'" stroke-width="'+(se.width||2)+'"'+(se.dash?' stroke-dasharray="'+se.dash+'"':'')+' stroke-linejoin="round" stroke-linecap="round"'+(se.opacity?' opacity="'+se.opacity+'"':'')+'/>';
    }
    if(se.dots)se.pts.forEach(function(p){s+='<circle cx="'+xs(p[0]).toFixed(1)+'" cy="'+ys(p[1]).toFixed(1)+'" r="'+(se.r||2.6)+'" fill="'+se.color+'"/>'});
  });
  (o.marks||[]).forEach(function(m){
    var x=xs(m.x),y=ys(m.y),anchor=x>W-70?'end':'start';
    s+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="4.2" fill="'+m.color+'" stroke="#0a0e13" stroke-width="1.5"/><text x="'+(anchor==='end'?x-7:x+7).toFixed(1)+'" y="'+(y-7).toFixed(1)+'" text-anchor="'+anchor+'" font-size="10.5" font-weight="700" fill="'+m.color+'">'+esc(m.label)+'</text>';
  });
  return s+'</svg>';
}

/* ---------- weight trend and goal projection ---------- */
function weighIns(){return Object.keys(S.vit).filter(function(d){return S.vit[d]&&S.vit[d].w!=null}).sort().map(function(d){return {d:d,x:dn(d),w:S.vit[d].w}})}
function emaSeries(pts,alpha){
  var by={},out=[],tr=null,lastX=null;
  pts.forEach(function(p){by[p.x]=p.w});
  for(var x=pts[0].x;x<=pts[pts.length-1].x;x++){
    if(by[x]!=null){if(tr==null)tr=by[x];else{tr=tr+(1-Math.pow(1-alpha,x-lastX))*(by[x]-tr)}lastX=x}
    out.push({x:x,t:tr});
  }
  return out;
}
function regress(pts){
  var n=pts.length,mx=0,mw=0,i;
  pts.forEach(function(p){mx+=p.x;mw+=p.w});mx/=n;mw/=n;
  var sxx=0,sxy=0;pts.forEach(function(p){sxx+=(p.x-mx)*(p.x-mx);sxy+=(p.x-mx)*(p.w-mw)});
  return sxx>0?sxy/sxx:0;
}
function goalProj(){
  var pts=weighIns(),r={pts:pts,hasGoal:!!(S.goalW&&S.goalDate),slope:null};
  if(!pts.length){r.none=true;return r}
  r.ema=emaSeries(pts,0.15);
  r.last=pts[pts.length-1];r.trend=r.ema[r.ema.length-1].t;
  var win=pts.filter(function(p){return p.x>=r.last.x-S.trendDays+1});
  r.n=win.length;r.span=win.length?win[win.length-1].x-win[0].x:0;
  if(win.length>=4&&r.span>=6)r.slope=regress(win);
  r.startW=S.goalStartW||pts[0].w;
  if(r.hasGoal){
    var gx=dn(S.goalDate),tx=dn(today());
    r.daysLeft=gx-tx;r.dir=S.goalW<r.startW?-1:1;
    r.reached=r.dir<0?r.trend<=S.goalW:r.trend>=S.goalW;
    r.toGoalLb=S.goalW-r.trend;
    var span=r.startW-S.goalW;
    r.pct=Math.abs(span)>0.05?Math.max(0,Math.min(100,(r.startW-r.trend)/span*100)):100;
    r.needWeek=(gx-r.last.x)>0?(S.goalW-r.trend)/((gx-r.last.x)/7):null;
    if(r.slope!=null){
      r.projTarget=r.trend+r.slope*(gx-r.last.x);
      r.onPace=r.dir<0?r.projTarget<=S.goalW:r.projTarget>=S.goalW;
      if(!r.reached&&r.slope*r.dir>0){r.hitX=r.last.x+Math.ceil((S.goalW-r.trend)/r.slope)}
    }
  }
  return r;
}
function projAt(gp,x){return gp.trend+gp.slope*(x-gp.last.x)}
function signedW(lb,dec){var v=wDisp(lb);return (v>0?'+':'')+v.toFixed(dec==null?1:dec)}
function goalCardHtml(){
  var gp=goalProj(),u=S.units,h='<div class="sec-head" style="margin:0 0 8px"><div class="eyebrow">WEIGHT GOAL</div><button class="btn sm" data-a="goaledit">'+(gp.hasGoal?'Edit goal':'Set goal')+'</button></div>';
  if(!gp.hasGoal){
    return h+'<div class="mut sm">Set a goal weight and a target date to see your trend, the date you are on pace to reach it, and your projected weight on the target date.</div>';
  }
  h+='<div class="goalline"><b>'+wFmt(S.goalW)+' '+u+'</b> by <b>'+esc(dnLabelY(dn(S.goalDate)))+'</b><span class="mut sm"> · '+(gp.daysLeft>0?gp.daysLeft+' days left':gp.daysLeft===0?'target date is today':'target date passed')+'</span></div>';
  if(gp.none){return h+'<div class="empty" style="margin-top:8px">Log a weigh-in to start tracking toward this goal.</div>'}
  h+='<div class="track" style="margin-top:10px;height:9px"><div class="fill" style="width:'+gp.pct+'%;background:linear-gradient(90deg,var(--blue),var(--teal))"></div></div><div class="mut sm" style="display:flex;justify-content:space-between;margin-top:5px"><span>Start '+wFmt(gp.startW)+'</span><span>'+r0(gp.pct)+'% there</span><span>Goal '+wFmt(S.goalW)+'</span></div>';
  var rate=gp.slope==null?null:gp.slope*7;
  h+='<div class="tiles2">'+
    '<div class="tile"><div class="tl">TREND WEIGHT</div><b>'+wFmt(gp.trend)+'<small> '+u+'</small></b><div class="ts">'+(gp.reached?'Goal reached':signedW(gp.toGoalLb)+' '+u+' to go')+'</div></div>'+
    '<div class="tile"><div class="tl">RATE (LAST '+Math.min(S.trendDays,Math.max(gp.span+1,1))+' DAYS)</div><b class="'+(rate==null?'':(rate*gp.dir>0?'neg':'pos'))+'">'+(rate==null?'–':signedW(rate,2))+'<small> '+u+'/wk</small></b><div class="ts">'+(rate==null?'Need 4+ weigh-ins over 7+ days':gp.n+' weigh-ins')+'</div></div>'+
    '<div class="tile"><div class="tl">PROJECTED ON TARGET DATE</div><b>'+(gp.projTarget==null?'–':wFmt(gp.projTarget))+'<small> '+u+'</small></b><div class="ts">'+(gp.projTarget==null?'':gp.onPace?'Meets goal by '+Math.abs(wDisp(gp.projTarget)-wDisp(S.goalW)).toFixed(1)+' '+u:'Misses goal by '+Math.abs(wDisp(gp.projTarget)-wDisp(S.goalW)).toFixed(1)+' '+u)+'</div></div>'+
    '<div class="tile"><div class="tl">PROJECTED GOAL DATE</div><b style="font-size:17px">'+(gp.reached?'Reached':gp.hitX==null?'Not on pace':esc(dnLabelY(gp.hitX)))+'</b><div class="ts">'+(gp.hitX!=null?(gp.hitX<=dn(S.goalDate)?Math.round(dn(S.goalDate)-gp.hitX)+' days ahead of target':Math.round(gp.hitX-dn(S.goalDate))+' days after target'):gp.reached?'':'Current trend is not heading to the goal')+'</div></div></div>';
  var msg='';
  if(gp.reached)msg='<span class="neg">Your trend weight has reached your goal.</span>';
  else if(gp.slope==null)msg='Log your weight on 4 or more days across at least a week and the projection will appear.';
  else if(gp.onPace)msg='<span class="neg">On pace.</span> At your current rate you finish at about '+wFmt(gp.projTarget)+' '+u+' on the target date.';
  else if(gp.needWeek!=null)msg='<span class="pos">Behind pace.</span> You need about '+signedW(gp.needWeek,2)+' '+u+'/wk from here to hit the target date; you are at '+signedW(gp.slope*7,2)+' '+u+'/wk.';
  h+='<div class="note" style="margin:2px 0 4px;color:var(--tx)">'+msg+'</div>';
  if(gp.slope!=null){
    var rows='',tx=dn(today());
    for(var i=1;i<=7;i++){var x=tx+i;rows+='<tr><td>'+esc(dnLabel(x))+'</td><td>'+wFmt(projAt(gp,x))+' '+u+'</td></tr>'}
    h+='<div class="eyebrow" style="margin:10px 0 2px">DAILY PROJECTION, NEXT 7 DAYS</div><div class="wk"><table>'+rows+'</table></div>';
  }
  h+='<div class="chiprow" style="align-items:center"><span class="mut sm">Trend window</span>'+[14,28,60].map(function(n){return '<button class="pill'+(S.trendDays===n?' on':'')+'" data-a="twin" data-n="'+n+'">'+n+' days</button>'}).join('')+'</div>';
  return h;
}
function weightChartHtml(){
  var gp=goalProj(),pts=gp.pts,u=S.units;
  var rangeChips='<div class="chiprow" style="margin:0 0 4px">'+[['30','30D'],['90','90D'],['all','All']].concat(gp.hasGoal?[['goal','To goal']]:[]).map(function(x){return '<button class="pill'+(ui.wr===x[0]?' on':'')+'" data-a="wrange" data-r="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>';
  if(!pts.length)return rangeChips+'<div class="empty">Log your weight to see the chart.</div>';
  var tx=dn(today()),x0,x1,r=ui.wr;
  if(r==='goal'&&gp.hasGoal){x1=Math.max(dn(S.goalDate),tx+7);x0=Math.min(Math.max(pts[0].x,tx-90),tx-14)}
  else if(r==='90'){x0=tx-90;x1=tx+7}
  else if(r==='all'){x0=Math.min(pts[0].x,tx-14);x1=tx+7}
  else{x0=tx-30;x1=tx+7}
  var dv=wDisp,vis=pts.filter(function(p){return p.x>=x0&&p.x<=x1});
  var ema=gp.ema.filter(function(p){return p.x>=x0&&p.x<=x1&&p.t!=null});
  var series=[{pts:vis.map(function(p){return [p.x,dv(p.w)]}),color:'#fbae3c',dots:true,r:2.8},{pts:ema.map(function(p){return [p.x,dv(p.t)]}),color:'#e8eef5',line:true,width:2.2}];
  var ys=vis.map(function(p){return dv(p.w)}).concat(ema.map(function(p){return dv(p.t)})),marks=[],hl=[],vl=[];
  if(gp.slope!=null&&gp.last.x<=x1){
    var pEnd=projAt(gp,x1);
    series.push({pts:[[gp.last.x,dv(gp.trend)],[x1,dv(pEnd)]],color:'#fbae3c',line:true,width:2,dash:'6 4'});
    ys.push(dv(pEnd));
    if(gp.hasGoal&&dn(S.goalDate)===x1)marks.push({x:x1,y:dv(pEnd),color:'#fbae3c',label:wFmt(pEnd)+' '+u});
  }
  if(gp.hasGoal){
    hl.push({y:dv(S.goalW),color:'#2ee6b6'});ys.push(dv(S.goalW));
    vl.push({x:dn(S.goalDate),color:'#2ee6b6'});
    if(gp.hitX!=null&&gp.hitX>=x0&&gp.hitX<=x1)marks.push({x:gp.hitX,y:dv(S.goalW),color:'#2ee6b6',label:dnLabel(gp.hitX)});
  }
  if(!ys.length)return rangeChips+'<div class="empty">No weigh-ins in this range.</div>';
  var lo=Math.min.apply(null,ys),hi=Math.max.apply(null,ys),pad2=(hi-lo)*0.1||1,nt=niceTicks(lo-pad2,hi+pad2,4);
  var svg=chartSvg({x0:x0,x1:x1,y0:nt.lo,y1:nt.hi,yTicks:nt.ticks,yFmt:function(v){return nt.step<1?v.toFixed(1):String(Math.round(v))},series:series,hlines:hl,vlines:vl,marks:marks,label:'Weight chart'});
  var leg='<div class="legend"><span><i style="background:#fbae3c"></i>Weigh-in</span><span><i style="background:#e8eef5"></i>Trend</span>'+(gp.slope!=null?'<span><i class="dash" style="border-color:#fbae3c"></i>Projection</span>':'')+(gp.hasGoal?'<span><i class="dash" style="border-color:#2ee6b6"></i>Goal</span>':'')+'</div>';
  return rangeChips+svg+leg;
}

/* ---------- metric charts (ketones, glucose, custom) ---------- */
function metricCardHtml(type,title,unit,color,dec){
  var tx=dn(today()),N=Number(ui.mr),x0=tx-N,x1=tx,i;
  var daily=[],roll=[],all=[];
  for(var x=x0;x<=x1;x++){
    var a=dailyAvg(type,fromDn(x));if(a!=null){daily.push([x,a]);all.push(a)}
  }
  for(x=x0;x<=x1;x++){
    var win=[];for(i=0;i<7;i++){var v=dailyAvg(type,fromDn(x-i));if(v!=null)win.push(v)}
    if(win.length)roll.push([x,avgOf(win)]);
  }
  var wk=[],raw=[];
  for(i=0;i<7;i++){var vv=dailyAvg(type,fromDn(tx-i));if(vv!=null)wk.push(vv);rdgs(fromDn(tx-i),type).forEach(function(r){raw.push(r.v)})}
  var a7=avgOf(wk),mn=raw.length?Math.min.apply(null,raw):null,mx=raw.length?Math.max.apply(null,raw):null;
  var h='<div class="eyebrow">'+esc(title.toUpperCase())+(unit?' ('+esc(unit)+')':'')+'</div><div class="hstat"><div><small>7-DAY AVG</small><b>'+(a7==null?'–':a7.toFixed(dec))+'</b></div><div><small>7-DAY LOW / HIGH</small><b>'+(mn==null?'–':mn+' / '+mx)+'</b></div></div>';
  if(!all.length)return h+'<div class="empty">No readings in the last '+N+' days.</div>';
  var lo=Math.min.apply(null,all),hi=Math.max.apply(null,all),p2=(hi-lo)*0.15||Math.max(0.5,hi*0.1),nt=niceTicks(Math.max(0,lo-p2),hi+p2,4);
  h+=chartSvg({H:176,x0:x0,x1:x1,y0:nt.lo,y1:nt.hi,yTicks:nt.ticks,yFmt:function(v){return nt.step<1?v.toFixed(1):String(Math.round(v))},series:[{pts:daily,color:color,dots:true,r:2.8},{pts:roll,color:'#e8eef5',line:true,width:2,dash:'5 4'}],label:title+' chart'});
  return h+'<div class="legend"><span><i style="background:'+color+'"></i>Daily average</span><span><i class="dash" style="border-color:#e8eef5"></i>7-day average</span></div>';
}
function metricsChartsHtml(){
  var chipsH='<div class="sec-head" style="margin:4px 2px 8px"><div class="eyebrow">TRENDS</div><div class="chiprow" style="margin:0">'+[['14','14D'],['30','30D'],['90','90D']].map(function(x){return '<button class="pill'+(ui.mr===x[0]?' on':'')+'" data-a="mrange" data-r="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div></div>';

/* ---------- weekly summary ---------- */
function weekData(start){
  var days=[],i;for(i=0;i<7;i++)days.push(addDays(start,i));
  var end=days[6],logged=days.filter(function(d){return dayTotals(d).k>=MIN_KCAL});
  var tot=sum(logged.map(function(d){return dayTotals(d)})),n=logged.length;
  var under=logged.filter(function(d){return dayTotals(d).nc<=S.goals.nc+1e-9}).length;
  var wd=days.filter(function(d){return vit(d).w!=null}).map(function(d){return {d:d,w:vit(d).w}});
  var pw=weightsIn(addDays(start,-7),addDays(start,-1));
  var kr=[],gr=[];days.forEach(function(d){vit(d).k.forEach(function(r){kr.push(r.v)});vit(d).g.forEach(function(r){gr.push(r.v)})});
  var fs=S.fasts.filter(function(f){var d=dstr(new Date(f.end));return d>=start&&d<=end});
  var wat=days.map(waterTotal).filter(function(x){return x>0});
  var ms=S.metrics.map(function(m){var vals=[];days.forEach(function(d){rdgs(d,'m:'+m.id).forEach(function(r){vals.push(r.v)})});return {m:m,avg:avgOf(vals),n:vals.length}}).filter(function(x){return x.n});
  return {start:start,end:end,n:n,under:under,avg:n?{k:tot.k/n,nc:tot.nc/n,p:tot.p/n,f:tot.f/n,fi:tot.fi/n}:null,
    wFirst:wd.length?wd[0].w:null,wLast:wd.length?wd[wd.length-1].w:null,wCount:wd.length,wAvg:avgOf(wd.map(function(x){return x.w})),wPrev:avgOf(pw),
    kAvg:avgOf(kr),kN:kr.length,gAvg:avgOf(gr),gN:gr.length,fN:fs.length,fAvg:fs.length?fs.reduce(function(a,f){return a+f.end-f.start},0)/fs.length:null,fHit:fs.filter(function(f){return f.end-f.start>=S.fastGoal*3600000}).length,
    water:avgOf(wat),ms:ms};
}
function weekText(w){
  var L=['MacroPulse weekly summary: '+rangeLabel(w)];
  L.push('Days logged: '+w.n+' of 7 (days with '+MIN_KCAL+'+ kcal)');
  if(w.avg){
    L.push('Avg calories: '+r0(w.avg.k).toLocaleString());
    L.push('Avg net carbs: '+fmt(w.avg.nc)+'g (goal '+fmt(S.goals.nc)+'g), '+w.under+' of '+w.n+' days at or under goal');
    L.push('Avg protein: '+r0(w.avg.p)+'g');
    L.push('Avg fat: '+r0(w.avg.f)+'g');
    L.push('Avg fiber: '+fmt(w.avg.fi)+'g');
  }
  var u=S.units;
  if(w.wCount){
    var s='Weight: '+wFmt(w.wFirst)+(w.wCount>1?' to '+wFmt(w.wLast)+' '+u+' ('+signed(wDisp(w.wLast)-wDisp(w.wFirst),1)+')':' '+u);
    if(w.wAvg!=null&&w.wPrev!=null)s+='; avg '+wFmt(w.wAvg)+' vs '+wFmt(w.wPrev)+' prior week ('+signed(wDisp(w.wAvg)-wDisp(w.wPrev),1)+')';
    L.push(s);
  }
  if(w.kN)L.push('Avg ketones: '+w.kAvg.toFixed(1)+' mmol/L ('+w.kN+' reading'+(w.kN>1?'s':'')+')');
  if(w.gN)L.push('Avg glucose: '+r0(w.gAvg)+' mg/dL ('+w.gN+' reading'+(w.gN>1?'s':'')+')');
  w.ms.forEach(function(x){L.push('Avg '+x.m.name.toLowerCase()+': '+x.avg.toFixed(x.m.dec==null?1:x.m.dec)+(x.m.unit?' '+x.m.unit:'')+' ('+x.n+' reading'+(x.n>1?'s':'')+')')});
  if(w.fN)L.push('Fasts: '+w.fN+', average '+fmtDur(w.fAvg)+', '+w.fHit+' reached '+fmt(S.fastGoal)+'h');
  if(w.water!=null)L.push('Avg water: '+r0(w.water).toLocaleString()+' ml');
  var gp=goalProj();
  if(gp.hasGoal&&!gp.none&&gp.slope!=null)L.push('Goal: '+wFmt(S.goalW)+' '+u+' by '+dnLabelY(dn(S.goalDate))+'; trend '+wFmt(gp.trend)+' '+u+' at '+signedW(gp.slope*7,2)+' '+u+'/wk; projected '+wFmt(gp.projTarget)+' '+u+' on the target date');
  return L.join('\n');
}

    '<div class="wk"><table>'+rows.join('')+'</table></div>'+

/* ---------- photo import (reads numbers on the phone, nothing is uploaded) ---------- */
var absUrl=function(p){return new URL(p,location.href).href};
function loadScript(src){
  return new Promise(function(res,rej){
    if(document.querySelector('script[data-src="'+src+'"]'))return res();
    var sc=document.createElement('script');sc.src=src;sc.dataset.src=src;sc.onload=function(){res()};sc.onerror=function(){rej(new Error('load '+src))};
    document.head.appendChild(sc);
  });
}
function fileToCanvas(file){
  function fromBmp(bmp,w,h){
    var m=Math.max(w,h),sc=m>2400?2400/m:m<1400?Math.min(2,1400/m):1,c=document.createElement('canvas');
    c.width=Math.round(w*sc);c.height=Math.round(h*sc);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return c;
  }
  if(window.createImageBitmap){
    return createImageBitmap(file,{imageOrientation:'from-image'}).catch(function(){return createImageBitmap(file)}).then(function(b){return fromBmp(b,b.width,b.height)});
  }
  return new Promise(function(res,rej){var im=new Image(),u=URL.createObjectURL(file);im.onload=function(){res(fromBmp(im,im.naturalWidth,im.naturalHeight));URL.revokeObjectURL(u)};im.onerror=rej;im.src=u});
}
function prepForOcr(canvas,invert){
  var c=document.createElement('canvas');c.width=canvas.width;c.height=canvas.height;
  var x=c.getContext('2d');x.drawImage(canvas,0,0);
  var im=x.getImageData(0,0,c.width,c.height),d=im.data,i,sum=0,n=d.length/4,lum=new Uint8Array(n);
  for(i=0;i<n;i++){var l=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2];lum[i]=l;sum+=l}
  var mean=sum/n,dark=mean<115,inv=invert==null?dark:invert,lo=255,hi=0;

    if(m==='skip')return '';
    if(m.slice(0,2)==='m:'){var d=metricDef(m.slice(2));return d?d.unit:''}
    if(m.slice(0,2)==='p:'){return PRESETS.filter(function(p){return p.key===m.slice(2)})[0].unit}
    return '';
  }
  function draw(){
    $('#rv-body',el).innerHTML=results.map(function(p,pi){
      return '<div class="rvphoto"><div style="display:flex;gap:12px;align-items:flex-start"><img src="'+p.url+'" alt="Photo '+(pi+1)+'" class="rvimg"><div style="flex:1;min-width:0"><div class="field" style="margin-bottom:6px"><label>Date for this photo</label><input class="inp rv-d" type="date" data-p="'+pi+'" value="'+(p.date||ui.date)+'" max="'+today()+'"></div>'+(p.date?'<div class="mut sm">Date found in the photo</div>':'<div class="mut sm">No date found, using '+esc(dlabel(ui.date))+'</div>')+'</div></div>'+
        (p.rows.length?'':'<div class="warn" style="margin:8px 0 4px">No numbers were recognized. Add them below.</div>')+
        '<div id="rows-'+pi+'">'+p.rows.map(function(r,ri){return rowHtml(pi,ri,r)}).join('')+'</div><button class="btn sm" data-addrow="'+pi+'" style="margin-top:8px">+ Add a row</button>'+
        '<details style="margin-top:8px"><summary class="mut sm">Text the reader saw</summary><pre class="rvtxt">'+esc(p.text||'(none)')+'</pre></details></div>';
    }).join('');
  }
  draw();
  el.addEventListener('click',function(ev){
    var a=ev.target.dataset.addrow;
    if(a!=null){var pi=Number(a);results[pi].rows.push({m:'w',v:null,label:'',unit:'',on:true});draw()}
  });
  el.addEventListener('change',function(ev){
    var t=ev.target,row=t.closest('.rvrow');
    if(t.classList.contains('rv-d')){results[Number(t.dataset.p)].date=t.value;return}
    if(!row)return;
    var r=results[Number(row.dataset.p)].rows[Number(row.dataset.r)];
    if(t.classList.contains('rv-m')){r.m=t.value;row.querySelector('.rv-u').textContent=unitFor(t.value);if(t.value==='skip')row.querySelector('.rv-on').checked=false}
    if(t.classList.contains('rv-on'))r.on=t.checked;
  });
  el.addEventListener('input',function(ev){
    var t=ev.target,row=t.closest('.rvrow');if(!row||!t.classList.contains('rv-v'))return;
    var r=results[Number(row.dataset.p)].rows[Number(row.dataset.r)];r.v=num(t.value);r.edited=true;r.vDisp=t.value;
  });
  $('#rv-ok',el).addEventListener('click',function(){
    var saved=0,bad=0;
    results.forEach(function(p){
      var d=p.date||ui.date,noon=new Date(d+'T12:00:00').getTime(),t=d===today()?Date.now():noon;
      p.rows.forEach(function(r){
        if(!r.on||r.m==='skip')return;
        var val=Number(r.edited?num(r.vDisp):(r.m==='w'?r.v:r.v));
        if(r.m==='w'&&r.edited)val=wFrom(num(r.vDisp));
        if(!(val>0)){bad++;return}
        var day=S.vit[d]=S.vit[d]||{k:[],g:[]};
        function pushR(arr,v2){arr=arr||[];if(!arr.some(function(x){return x.v===v2}))arr.push({v:v2,t:t});return arr}
        if(r.m==='w'){if(val<50||val>700){bad++;return}day.w=Math.round(val*100)/100}
        else if(r.m==='k'){if(val>10){bad++;return}day.k=pushR(day.k,Math.round(val*100)/100)}
        else if(r.m==='g'){if(val<20||val>800){bad++;return}day.g=pushR(day.g,Math.round(val*10)/10)}
        else{
          var key=rowMetricKey(r.m),id;
          if(key.slice(0,2)==='p:'){var pr=PRESETS.filter(function(x){return x.key===key.slice(2)})[0],mdef=ensureMetric(pr.name,pr.unit);mdef.dec=pr.dec;id=mdef.id}
          else id=key.slice(2);
          day.m=day.m||{};day.m[id]=pushR(day.m[id],Math.round(val*100)/100);
        }
        saved++;
      });
    });
    save();closeSheet();render();
    toast(saved?('Saved '+saved+' reading'+(saved>1?'s':'')+(bad?' ('+bad+' skipped)':'')):'Nothing was saved');
  });
}

/* ---------- settings ---------- */
function openSettings(){
  var g=S.goals;
  var el=sheet('<div class="sh-h"><div class="eyebrow">DAILY TARGETS &amp; DATA</div><button class="x" data-a="close">✕</button></div>'+
   '<div class="grid2"><div class="field"><label>Calories (kcal)</label><input class="inp" id="g-k" inputmode="numeric" value="'+g.k+'"></div><div class="field"><label>Net carbs (g)</label><input class="inp" id="g-nc" inputmode="numeric" value="'+g.nc+'"></div><div class="field"><label>Protein (g)</label><input class="inp" id="g-p" inputmode="numeric" value="'+g.p+'"></div><div class="field"><label>Fat (g)</label><input class="inp" id="g-f" inputmode="numeric" value="'+g.f+'"></div><div class="field"><label>Fiber (g)</label><input class="inp" id="g-fi" inputmode="numeric" value="'+g.fi+'"></div><div class="field"><label>Water (ml)</label><input class="inp" id="g-w" inputmode="numeric" value="'+g.w+'"></div></div>'+
   '<div class="field"><label>Water bottle size (ml)</label><input class="inp" id="g-b" inputmode="numeric" value="'+S.bottle+'"></div>'+
   '<div class="grid2"><div class="field"><label>Fasting goal (hours)</label><input class="inp" id="g-fg" inputmode="decimal" value="'+S.fastGoal+'"></div><div class="field"><label>Weight unit</label><select class="inp" id="g-u"><option value="lb"'+(S.units==='lb'?' selected':'')+'>lb</option><option value="kg"'+(S.units==='kg'?' selected':'')+'>kg</option></select></div></div>'+
   '<button class="btn primary" style="width:100%" id="g-save">Save Targets</button><div class="sep"></div>'+
   '<div class="eyebrow" style="margin-bottom:8px">BACKUP</div><div class="note" style="margin-bottom:10px">Your data lives only on this device. Export a backup now and then, and use Import to move it to another phone.</div>'+
   '<div class="btnrow" style="margin-top:0"><button class="btn" id="g-exp">Export Backup</button><button class="btn" id="g-imp">Import Backup</button></div><input type="file" id="g-file" accept="application/json,.json" style="display:none">'+
   '<div class="sep"></div><div class="eyebrow" style="margin-bottom:8px">INSTALL ON YOUR PHONE</div><div class="note">iPhone: open in Safari, tap Share, then Add to Home Screen.<br>Android: open in Chrome, tap the menu, then Install app (or Add to Home screen).<br>Open it from the home-screen icon every time so your data stays in one place.</div>'+
   '<div class="sep"></div><div class="note">Built-in foods are approximate values for the stated serving. Check labels and use the Custom tab for anything you want exact. Barcode lookups use Open Food Facts (openfoodfacts.org), a crowd-sourced database, so verify the numbers against the package.</div>'+
   '<button class="btn danger" style="width:100%;margin-top:14px" id="g-reset">Erase All Data</button>');
  $('#g-save',el).addEventListener('click',function(){
    var v=function(id){return num($('#'+id,el).value)};
    if(v('g-k')<=0){toast('Calories must be above zero');return}
    S.goals={k:v('g-k'),nc:v('g-nc'),p:v('g-p'),f:v('g-f'),fi:v('g-fi'),w:v('g-w')||3000};
    S.bottle=v('g-b')>0?v('g-b'):750;
    S.fastGoal=v('g-fg')>0?Math.min(72,v('g-fg')):16;S.units=$('#g-u',el).value==='kg'?'kg':'lb';
    save();closeSheet();render();toast('Targets saved');
  });
  $('#g-exp',el).addEventListener('click',function(){
    var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='macropulse-backup-'+today()+'.json';document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
  });
  $('#g-imp',el).addEventListener('click',function(){$('#g-file',el).click()});
  $('#g-file',el).addEventListener('change',function(ev){
    var f=ev.target.files[0];if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var d=JSON.parse(rd.result);
        if(!d||typeof d!=='object'||typeof d.log!=='object'||!d.goals)throw new Error('bad');
        if(!confirm('Replace everything on this device with this backup?'))return;
        S=Object.assign(defaults(),d);S.goals=Object.assign(defaults().goals,d.goals);S.seeded=true;
        save();closeSheet();render();toast('Backup restored');
      }catch(e){toast('That file is not a MacroPulse backup')}
    };
    rd.readAsText(f);
  });
  $('#g-reset',el).addEventListener('click',function(){
    if(!confirm('Erase all logged food, custom foods, recipes and targets on this device?'))return;
    S=defaults();S.seeded=true;save();closeSheet();ui.rd=null;ui.cf={};ui.cfEdit=null;ui.cfBc=null;render();toast('All data erased');
  });
}
function openWaterSheet(){
  var el=sheet('<div class="sh-h"><div class="eyebrow">LOG WATER</div><button class="x" data-a="close">✕</button></div><div class="field"><label>Amount (ml)</label><input class="inp" id="w-ml" inputmode="decimal" placeholder="e.g. 355"></div><div class="mut sm">1 cup = 237 ml · 12 oz = 355 ml · 16 oz = 473 ml · 1 liter = 1000 ml</div><div class="btnrow"><button class="btn primary" id="w-ok">Add</button></div>');
  $('#w-ok',el).addEventListener('click',function(){
    var v=num($('#w-ml',el).value);if(!(v>0)){toast('Enter an amount');return}
    (S.water[ui.date]=S.water[ui.date]||[]).push(v);save();closeSheet();render();
  });
  setTimeout(function(){$('#w-ml',el).focus()},60);
}

/* ---------- render ---------- */
function render(){
  if(ui.tab==='health'&&!ui.wk)ui.wk=monday(today());
  $('#hdate').textContent=dlabel(ui.date);
  [].forEach.call(document.querySelectorAll('#tabs button'),function(b){b.classList.toggle('on',b.dataset.t===ui.tab)});
  var v=$('#view');
  v.innerHTML=ui.tab==='log'?renderLog():ui.tab==='search'?renderSearch():ui.tab==='custom'?renderCustom():ui.tab==='health'?renderHealth():renderRecipes();
}
function go(tab){ui.tab=tab;render();window.scrollTo(0,0)}

/* ---------- events ---------- */
var A={
  tab:function(el){go(el.dataset.t)},
  close:closeSheet,
  settings:openSettings,
  prevday:function(){ui.date=addDays(ui.date,-1);ui.followToday=false;render()},
  nextday:function(){ui.date=addDays(ui.date,1);ui.followToday=false;render()},
  todaybtn:function(){ui.date=today();ui.followToday=true;render()},
  water:function(el){(S.water[ui.date]=S.water[ui.date]||[]).push(num(el.dataset.ml));save();render()},
  waterundo:function(){(S.water[ui.date]||[]).pop();save();render()},
  watercustom:openWaterSheet,
  addfood:function(el){ui.meal=el.dataset.meal;ui.q='';ui.filter='all';go('search')},
  editentry:function(el){
    var e=dayEntries(ui.date).filter(function(x){return x.id===el.dataset.id})[0];if(!e)return;
    var src=foodById(e.ref);
    openLogSheet({id:e.ref,name:e.name,src:src?src.src:'Logged entry',srv:e.srv,g:src?src.g:0,b:e.b,e:''},e);
  },
  pick:function(el){var f=foodById(el.dataset.id);if(f)openLogSheet(f)},
  fav:function(el){
    var id=el.dataset.id,i=S.fav.indexOf(id);
    if(i>-1)S.fav.splice(i,1);else S.fav.push(id);
    save();el.classList.toggle('on',i<0);
    if(ui.filter==='fav'){$('#results').innerHTML=resultsHtml()}
  },
  filter:function(el){ui.filter=el.dataset.f;render()},
  clearq:function(){ui.q='';var q=$('#q');if(q){q.value='';q.focus()}$('#results').innerHTML=resultsHtml()},
  faststart:function(){openFastStart(false)},
  fastnow:function(){S.fast={start:Date.now()};save();render();toast('Fast started')},
  fastedit:function(){openFastStart(true)},
  fastend:function(){
    if(!S.fast)return;
    var end=Date.now(),dur=end-S.fast.start;
    if(dur>=300000)S.fasts.push({start:S.fast.start,end:end});
    S.fast=null;save();render();toast(dur>=300000?'Fast logged: '+fmtDur(dur):'Fast was under 5 minutes, not saved');
  },
  fastcancel:function(){if(!confirm('Discard this fast without saving it?'))return;S.fast=null;save();render()},
  vadd:function(el){
    var t=el.dataset.t,inp=$('#hv-'+t.replace(':','-'));if(!inp)return;
    var raw=num(inp.value);if(!(raw>0)){toast('Enter a number');return}
    var v=S.vit[ui.date]=S.vit[ui.date]||{k:[],g:[]};
    if(t==='w'){
      var lb=wFrom(raw);if(lb<50||lb>700){toast('That weight looks off, check the number');return}
      v.w=Math.round(lb*100)/100;
    }else if(t==='k'){
      if(raw>10){toast('Ketones are in mmol/L (usually 0 to 6)');return}
      (v.k=v.k||[]).push({v:Math.round(raw*100)/100,t:Date.now()});
    }else if(t==='g'){
      if(raw<20||raw>800){toast('Glucose is in mg/dL, check the number');return}
      (v.g=v.g||[]).push({v:Math.round(raw*10)/10,t:Date.now()});
    }else{
      var id=t.slice(2);v.m=v.m||{};(v.m[id]=v.m[id]||[]).push({v:Math.round(raw*100)/100,t:Date.now()});
    }
    save();render();toast('Saved');
  },
  vdel:function(el){
    var v=S.vit[ui.date],t=el.dataset.t;if(!v)return;
    if(t==='w')delete v.w;
    else if(t==='k'||t==='g')v[t].splice(Number(el.dataset.i),1);
    else if(v.m&&v.m[t.slice(2)])v.m[t.slice(2)].splice(Number(el.dataset.i),1);
    save();render();
  },
  goaledit:openGoalSheet,
  metricadd:openMetricSheet,
  twin:function(el){S.trendDays=Number(el.dataset.n);save();$('#goal-card').innerHTML=goalCardHtml();$('#w-chart').innerHTML=weightChartHtml()},
  wrange:function(el){ui.wr=el.dataset.r;$('#w-chart').innerHTML=weightChartHtml()},
  mrange:function(el){ui.mr=el.dataset.r;$('#m-charts').innerHTML=metricsChartsHtml()},
  photo:function(){var f=$('#photo-in');if(f)f.click()},
  wkprev:function(){ui.wk=addDays(ui.wk,-7);$('#wk-card').innerHTML=weeklyHtml()},
  wknext:function(){if(ui.wk>=monday(today()))return;ui.wk=addDays(ui.wk,7);$('#wk-card').innerHTML=weeklyHtml()},
  wkcopy:function(){copyText(weekText(weekData(ui.wk))).then(function(){toast('Summary copied')}).catch(function(){toast('Could not copy')})},
  wkshare:function(){navigator.share({title:'MacroPulse weekly summary',text:weekText(weekData(ui.wk))}).catch(function(){})},
  scan:function(){openScanner('log')},
  scanform:function(){openScanner('form')},
  cfauto:function(){ui.cf.k=String(r0(cfCalc().formula));$('#cf-k').value=ui.cf.k;$('#cf-status').innerHTML=cfStatusHtml()},
  cfsave:function(){var f=cfBuild();if(!f)return;ui.cf={};ui.cfEdit=null;ui.cfBc=null;render();toast('Saved '+f.name)},
  cfsavelog:function(){
    var f=cfBuild();if(!f)return;ui.cf={};ui.cfEdit=null;ui.cfBc=null;render();
    var food=foodById(f.id);if(food)openLogSheet(food);
  },
  cfcancel:function(){ui.cf={};ui.cfEdit=null;ui.cfBc=null;render()},
  cfedit:function(el){
    var f=S.custom.filter(function(x){return x.id===el.dataset.id})[0];if(!f)return;
    ui.cfEdit=f.id;ui.cfBc=f.bc||null;ui.cf={name:f.name,src:f.src||'',srv:f.srv,g:String(f.g),k:String(f.b.k),c:String(f.b.c),fi:String(f.b.fi),po:String(f.b.po),p:String(f.b.p),f:String(f.b.f)};
    render();window.scrollTo(0,0);
  },
  cfdel:function(el){
    if(!confirm('Delete this custom food? Past log entries are kept.'))return;
    S.custom=S.custom.filter(function(x){return x.id!==el.dataset.id});
    S.fav=S.fav.filter(function(x){return x!==el.dataset.id});S.recent=S.recent.filter(function(x){return x!==el.dataset.id});
    save();render();
  },
  rnew:function(){ui.rd={id:uid(),name:'',servings:4,prep:'',cook:'',ing:[],isNew:true};ui.rview='serving';render();window.scrollTo(0,0)},
  redit:function(el){
    var r=S.recipes.filter(function(x){return x.id===el.dataset.id})[0];if(!r)return;
    ui.rd=JSON.parse(JSON.stringify(r));ui.rview='serving';render();window.scrollTo(0,0);
  },
  rback:function(){ui.rd=null;render()},
  rserv:function(el){ui.rd.servings=Math.max(1,Math.min(99,ui.rd.servings+Number(el.dataset.d)));$('#r-serv').textContent=ui.rd.servings;$('#r-nut').innerHTML=nutHtml()},
  rview:function(el){ui.rview=el.dataset.v;$('#r-nut').innerHTML=nutHtml()},
  ingadd:openIngPicker,
  ingdel:function(el){ui.rd.ing.splice(Number(el.dataset.i),1);render()},
  rsave:function(){
    var r=ui.rd;
    if(!String(r.name).trim()){toast('Name the recipe first');return}
    if(!r.ing.length){toast('Add at least one ingredient');return}
    var c=JSON.parse(JSON.stringify(r));delete c.isNew;c.name=c.name.trim();
    var i=-1;S.recipes.forEach(function(x,n){if(x.id===c.id)i=n});
    if(i>-1)S.recipes[i]=c;else S.recipes.push(c);
    save();ui.rd=null;render();toast('Recipe saved');
  },
  rlog:function(){
    var r=ui.rd;
    if(!r.ing.length){toast('Add ingredients first');return}
    var f=recipeFood(r);openLogSheet(f);
  },
  rdel:function(){
    var r=ui.rd;
    if(!confirm('Delete this recipe?'))return;
    S.recipes=S.recipes.filter(function(x){return x.id!==r.id});
    S.fav=S.fav.filter(function(x){return x!==r.id});S.recent=S.recent.filter(function(x){return x!==r.id});
    save();ui.rd=null;render();toast('Recipe deleted');
  }
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var fn=A[el.dataset.a];if(fn){fn(el,e)}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){ui.q=t.value;$('#results').innerHTML=resultsHtml();return}
  if(t.dataset&&t.dataset.cf){ui.cf[t.dataset.cf]=t.value;var s=$('#cf-status');if(s)s.innerHTML=cfStatusHtml();return}
  if(t.id==='r-name'){ui.rd.name=t.value;return}
  if(t.id==='r-prep'){ui.rd.prep=t.value;return}
  if(t.id==='r-cook'){ui.rd.cook=t.value;return}
  if(t.dataset&&t.dataset.ing!=null){
    var i=Number(t.dataset.ing);ui.rd.ing[i].g=Math.max(0,num(t.value));
    $('#r-nut').innerHTML=nutHtml();
    var row=t.closest('.ing'),sm=row.querySelector('small'),s2=scale(ui.rd.ing[i].pg,ui.rd.ing[i].g);
    sm.textContent=r0(s2.k)+' kcal · '+fmt(ncOf(s2))+'g NC · '+fmt(s2.p)+'g P · '+fmt(s2.f)+'g F';
    var n=recipeNut(ui.rd),meta=document.querySelector('#r-ing .sec-head .mut');
    if(meta)meta.textContent=ui.rd.ing.length+' items · '+r0(n.g)+' g combined';
  }
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;var t=e.target;
  if(t&&/^hv-(w|k|g|m-.+)$/.test(t.id)){var key=t.id.slice(3).replace(/^m-/,'m:');var b=document.querySelector('[data-a=vadd][data-t="'+key+'"]');if(b)b.click()}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t&&t.id==='photo-in'&&t.files&&t.files.length){var fl=t.files;importFiles(fl);setTimeout(function(){t.value=''},0)}
});
document.addEventListener('visibilitychange',function(){
  if(!document.hidden)tickFast();
  if(!document.hidden&&ui.followToday&&ui.date!==today()){ui.date=today();ui.meal=autoMeal();if(!$('#sheet-root .sh'))render()}
});

render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
